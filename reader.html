<script>try{(function(){
var L=31.23,LG=121.47,r=Math.PI/180;
function sun(){var d=new Date(),N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),
dec=r*23.44*Math.sin(r*(360/365)*(N-81)),
c=(Math.sin(-.833*r)-Math.sin(L*r)*Math.sin(dec))/(Math.cos(L*r)*Math.cos(dec)),
now=d.getHours()*60+d.getMinutes();
if(c>1)return{night:true};if(c<-1)return{night:false};
var H=Math.acos(c)/r,B=r*(360/365)*(N-81),
E=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B),
n=720-4*(LG+d.getTimezoneOffset()/4)-E,  /* 太阳正午（当地钟表分钟）：标准经线差 + 均时差 */
fm=function(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mi=Math.floor(m%60);return(h<10?"0":"")+h+":"+(mi<10?"0":"")+mi};
return{night:now<n-H*4||now>n+H*4,rise:fm(n-H*4),set:fm(n+H*4)}}
window.__tallerSunFn=sun;window.__tallerSun=sun();
var __t=localStorage.getItem('taller-theme')||(window.__tallerSun.night?'negro':'bermellon');
if(__t!=='naranja')document.documentElement.dataset.theme=__t;
})()}catch(_){}</script>

/* ---- 液态玻璃（与全站同配方：镜面高光 + 内缘光） ---- */
.g-glass,.g-card{position:relative}
.g-glass{background:linear-gradient(150deg,var(--g-glass-hi),var(--g-glass-lo));
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.8) brightness(1.05);
  backdrop-filter:blur(var(--g-blur)) saturate(1.8) brightness(1.05);
  border:1px solid color-mix(in srgb,var(--g-text) 20%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(0,0,0,.14),
    inset 0 18px 34px -26px rgba(255,255,255,.30),0 34px 90px var(--g-drop)}
.g-card{-webkit-backdrop-filter:blur(18px) saturate(1.7) brightness(1.04);
  backdrop-filter:blur(18px) saturate(1.7) brightness(1.04)}
.g-glass::before,.g-card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 62% at 16% 0%,color-mix(in srgb,var(--ink) 16%,transparent),transparent 55%),
    linear-gradient(115deg,color-mix(in srgb,var(--ink) 8%,transparent),transparent 30%,transparent 72%,color-mix(in srgb,var(--ink) 5%,transparent));
  mix-blend-mode:screen}
.g-glass>*,.g-card>*{position:relative;z-index:1}

/* ---- 顶栏 ---- */
.top{display:flex;align-items:center;gap:16px;padding-bottom:18px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--g-dim);text-decoration:none;font-size:13px;
  padding:9px 16px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--ink) 13%,transparent);transition:.25s}
.back:hover{color:var(--g-text)}
.brand{margin-right:auto}
.brand b{font-size:17px;font-weight:600;display:block}
.brand small{font-size:11px;color:var(--g-dim);letter-spacing:2px;text-transform:uppercase}
.whoami{display:none;align-items:center;gap:10px}
.whoami.on{display:inline-flex}
.whoami .avatar-dot{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--ink) 16%,transparent);display:grid;place-items:center;font-size:13px}
.whoami .nm{font-size:13px}
.role-chip{font-size:11px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 36%,transparent)}
.wlink-out{color:var(--g-dim);font-size:12px;text-decoration:none;border-bottom:1px dashed var(--g-brd)}
.wlink-out:hover{color:var(--g-text)}
.themedots{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;flex:none;
  background:color-mix(in srgb,var(--ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.tdot{width:17px;height:17px;border-radius:50%;border:0;cursor:pointer;padding:0;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8),var(--dot) 60%);
  box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.5);transition:.25s}
.tdot:hover{transform:scale(1.18)}
.tdot.on{box-shadow:0 0 0 2px var(--g-bg-base),0 0 0 3.5px var(--dot),0 2px 8px rgba(0,0,0,.35)}

/* ---- 配色折叠：平时只露当前色一颗 + ▾，悬浮/聚焦展开整排（间距由 gap 改为两侧 margin 以便收拢） ---- */
.themedots{gap:0}
.themedots .tdot{margin:0 3.5px;transition:width .28s,opacity .28s,margin .28s,transform .25s}
.themedots:not(:hover):not(:focus-within):has(.tdot.on) .tdot:not(.on){width:0;opacity:0;margin:0;pointer-events:none}
.themedots:hover .tdot,.themedots:focus-within .tdot{width:17px;opacity:1;margin:0 3.5px;pointer-events:auto}
.themedots::after{content:"▾";font-size:10px;line-height:1;color:var(--g-dim);margin-left:4px;transition:transform .28s;pointer-events:none}
.themedots:hover::after,.themedots:focus-within::after{transform:rotate(180deg)}

/* ---- 区块头 ---- */
.section-head{display:flex;align-items:baseline;gap:16px;margin:40px 0 18px}
.section-head .eyebrow{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--g-accent);font-weight:600}
.section-head h2{font-size:23px;font-weight:650}
.section-head .hint{margin-left:auto;font-size:12px;color:var(--g-dim)}
.foldbtn{border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--g-dim);cursor:pointer;
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;transition:.25s;flex:none;align-self:center;margin-left:12px}
.foldbtn:hover{background:color-mix(in srgb,var(--ink) 16%,transparent);color:var(--g-text)}
.foldbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.foldbtn.folded svg{transform:rotate(-90deg)}
/* hidden 属性会被 .wbgrid 的 display:grid 盖掉，必须显式声明 */
.wbgrid[hidden]{display:none}

/* ---- Panel 五卡 ---- */
.wbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.wbcard{border-radius:26px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
/* arXiv 卡横跨两列：右缘与第一行 B站卡对齐（手机档还原单列） */
#card-arxiv{grid-column:span 2}
.chead{display:flex;align-items:center;gap:10px}
.chead .cbar{width:8px;height:26px;border-radius:2px;flex:none;background:var(--c,#ff9d2e)}
.chead b{font-size:14.5px;font-weight:600}
.chead .upd{margin-left:auto;font-size:10.5px;color:var(--g-dim)}
.rfbtn{border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--g-text);cursor:pointer;
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;transition:.25s;flex:none}
.rfbtn:hover{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.rfbtn svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rfbtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.cbody{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.dim{color:var(--g-dim)}
.err{color:#ff8a80;font-size:11.5px;line-height:1.6}
.okline{color:var(--ok)}
.lvl-pill{font-size:10.5px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--g-accent) 16%,transparent);color:var(--g-accent-soft)}
.qrow{display:flex;align-items:center;gap:10px}
.qlab{width:40px;flex:none;color:var(--g-dim);font-size:11.5px}
.qpct{width:44px;flex:none;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.qrst{margin-left:auto;color:var(--g-dim);font-size:10.5px;white-space:nowrap}
.qsub{font-size:10.5px;color:var(--g-dim);padding-left:50px;font-variant-numeric:tabular-nums}
.qsub b{color:color-mix(in srgb,var(--g-text) 90%,transparent);font-weight:600}
.spark{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.spark .st{font-size:10.5px;color:var(--g-dim);display:flex;justify-content:space-between;gap:8px}
.spark .st b{color:color-mix(in srgb,var(--g-text) 90%,transparent);font-weight:600;font-variant-numeric:tabular-nums}
.spark svg{width:100%;height:40px;display:block}
.spark .sarea{fill:color-mix(in srgb,var(--g-accent) 16%,transparent)}
.spark .sline{stroke:var(--g-accent-soft);fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark .sdot{fill:var(--g-accent)}
.track{flex:1;height:12px;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;min-width:60px}
.fill{height:100%;border-radius:999px;background:#3fb950;transition:width .6s ease}
.oilprice{font-size:30px;font-weight:650;letter-spacing:.5px}
.oilunit{font-size:11px;color:var(--g-dim);margin-left:6px}
.ilist{display:flex;flex-direction:column;gap:2px;min-width:0}
/* arXiv 六篇两列（列优先：1-3 左列，4-6 右列） */
.xgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;column-gap:26px;min-width:0}
.xgrid .item:nth-child(3n){border-bottom:0}

/* ---- Ajustes ---- */
details.settings{border-radius:20px;border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);background:color-mix(in srgb,var(--ink) 4%,transparent);padding:0 18px;margin-top:26px}

<script>
(function () {
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  var url = new URLSearchParams(location.search).get("url") || "";
  var t0 = Date.now();
  var timer = setInterval(function () {
    var el = document.getElementById("aLoading");
    if (el) el.textContent = "正在取正文与翻译…已等 " + Math.round((Date.now() - t0) / 1000) + " 秒";
  }, 1000);
  function fail(html) {
    clearInterval(timer);
    document.getElementById("aBody").innerHTML = '<p class="rload">' + html + '</p>';
  }
  if (!/^https?:\/\//.test(url)) { fail("缺少文章参数"); return; }
  fetch("/api/workbench/article?url=" + encodeURIComponent(url))
    .then(function (r) { return r.json(); })
    .then(function (r) {
      clearInterval(timer);
      if (!r.ok) { fail(esc(r.error || "读取失败") + "<br>境外源偶发抖动，稍后刷新重试通常就好；<a class=\"backlink\" href=\"workbench.html\">← 回工作台</a>"); return; }
      var a = r.article;
      document.title = a.title.slice(0, 40) + " · Lectura · El Taller";
      document.getElementById("aTitle").textContent = a.title;
      var hoursLeft = Math.max(0, Math.ceil((a.deadline - Date.now()) / 3600e3));
      var st = a.promoted ? "已收入 Biblioteca ✓" : "未评论 · " + hoursLeft + " 小时后自动清除";
      document.getElementById("aMeta").textContent =
        (a.source === "arxiv" ? "arXiv" : "Anthropic 研究") + (a.pub ? " · " + a.pub : "") + " · " + st +
        (a.comment ? " · 已评论" : " · 评论与 👎 请回工作台");
      document.getElementById("aBody").innerHTML = a.paras.map(function (p) {
        return p[1]
          ? '<div class="rpair"><p class="rzh">' + esc(p[1]) + '</p><p class="rorig">' + esc(p[0]) + "</p></div>"
          : '<div class="rpair"><p class="rzh">' + esc(p[0]) + "</p></div>";
      }).join("") +
        (a.comment ? '<div class="rcmt"><b>我的评论</b><p>' + esc(a.comment) + "</p></div>" : "");
    })
    .catch(function (e) {
      fail("读取失败：" + esc(String(e)) + ' · 可能登录已过期，<a class="backlink" href="login.html">重新登录</a>');
    });
})();
</script>
<script>
/* ================= 主题切换（与全站同款） ================= */
(function () {
  var dots = Array.prototype.slice.call(document.querySelectorAll(".tdot"));
  function apply(t) {
    if (t === "naranja") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    dots.forEach(function (d) { d.classList.toggle("on", d.dataset.themeDot === t); });
  }
  var cur = "bermellon"; try{if(!localStorage.getItem('taller-theme')&&window.__tallerSun&&window.__tallerSun.night)cur='negro'}catch(_){}
  try { cur = localStorage.getItem("taller-theme") || 'bermellon'; } catch (_) {}
  apply(cur);
  dots.forEach(function (d) { d.addEventListener("click", function () {
    cur = d.dataset.themeDot;
    try { localStorage.setItem("taller-theme", cur); } catch (_) {}
    apply(cur);
  }); });
})();
</script>

<script>/* 日落自动玄黑 · 日出回朱漆红：仅未手动选过主题的访客；每分钟复查 */
setInterval(function(){try{
if(localStorage.getItem('taller-theme'))return;
var S=window.__tallerSunFn&&window.__tallerSunFn();if(!S)return;window.__tallerSun=S;
var t=S.night?'negro':'bermellon';
if(document.documentElement.dataset.theme!==t){document.documentElement.dataset.theme=t;
document.querySelectorAll('.tdot').forEach(function(d){d.classList.toggle('on',d.dataset.themeDot===t)})}
}catch(_){}},60000);
</script></body>
