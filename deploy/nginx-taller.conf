# El Taller Nginx 反代配置
# 放到服务器: /etc/nginx/sites-available/taller
# 然后: sudo ln -s /etc/nginx/sites-available/taller /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS 由 certbot 自动改写本文件: sudo certbot --nginx -d tallerdeandres.cn -d www.tallerdeandres.cn
# 注意：certbot 生成的 443 块也要有 client_max_body_size（线上 2026-10-21 已手工同步）

# 登录接口限速：每 IP 每秒最多 1 次，突发 10 次
limit_req_zone $binary_remote_addr zone=taller_login:10m rate=1r/s;

# 文本响应 gzip 压缩（2026-10-26 UIUX D 批上线实测版；线上 /etc/nginx/sites-available/taller 已同步）
# 两点关键：① gzip_proxied any —— nginx 默认不压缩反代（proxy_pass）响应，这是全站文本裸传的根因；
#           ② .js 的 MIME 是 text/javascript（Node 按现代标准），application/javascript 压不到它。
# text/html 无需列出（nginx 隐含包含且列出会告 duplicate MIME type）；GLB 类型为 3D 时代遗留，models 已不上线但留着无害。
# 注意：nginx.conf http 层已有 gzip on（勿在本文件重复，会 duplicate 报错）
gzip_types model/gltf-binary application/octet-stream text/css application/javascript text/javascript application/json image/svg+xml;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;

server {
    listen 80;
    server_name tallerdeandres.cn www.tallerdeandres.cn;

    # 上传 PDF 允许到 25MB（Node 端点自身上限 25MB；nginx 默认 1MB 会 413，2026-10-21 修复）
    client_max_body_size 30m;

    # 安全响应头（2026-10-14 加固；certbot 建 443 块时会一并带过去）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Yoyo 家庭同步 TLS 通道：/yoyo/ → 仅本机 8367（配套 deploy/nginx-yoyo.conf）
    location /yoyo/ {
        proxy_pass http://127.0.0.1:8367/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # 登录接口限速
    location /api/login {
        limit_req zone=taller_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8891;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8891;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
