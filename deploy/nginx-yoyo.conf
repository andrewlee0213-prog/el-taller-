# Yoyo 家庭同步 Nginx 配置（2026-10-14 安全加固）
# 放到服务器: /etc/nginx/sites-available/yoyo-sync
# 然后: sudo ln -s /etc/nginx/sites-available/yoyo-sync /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 架构：yoyo_sync_server.py 以专用用户 yoyo-sync 运行，只听 127.0.0.1:8367（unit 已沙箱化）。
#   8366 = 明文兼容通道，给直连 http://110.40.209.237:8366 的老客户端
#   /yoyo/（在 nginx-taller.conf 的 443 块里）= TLS 通道，新客户端用 https://tallerdeandres.cn/yoyo/
# 全部客户端迁到 TLS 后，可在腾讯云安全组把 8366 关掉，本文件即可退役。

server {
    listen 8366;
    location / {
        proxy_pass http://127.0.0.1:8367;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
