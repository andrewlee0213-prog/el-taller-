/* ---- 液态玻璃（Apple Liquid Glass 质感）：镜面高光 + 内缘光 + 高饱和折射 ---- */
.g-glass,.g-card,.enlace{position:relative}
.g-glass{background:linear-gradient(150deg,var(--g-glass-hi),var(--g-glass-lo));
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.8) brightness(1.05);
  backdrop-filter:blur(var(--g-blur)) saturate(1.8) brightness(1.05);
  border:1px solid color-mix(in srgb,var(--g-text) 20%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(0,0,0,.14),
    inset 0 18px 34px -26px rgba(255,255,255,.30),0 34px 90px var(--g-drop)}
.g-card,.workcard,.notecard,.enlace{-webkit-backdrop-filter:blur(18px) saturate(1.7) brightness(1.04);
  backdrop-filter:blur(18px) saturate(1.7) brightness(1.04)}
.g-glass::before,.g-card::before,.workcard::before,.notecard::before,.enlace::before,.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 62% at 16% 0%,color-mix(in srgb,var(--ink) 16%,transparent),transparent 55%),
    linear-gradient(115deg,color-mix(in srgb,var(--ink) 8%,transparent),transparent 30%,transparent 72%,color-mix(in srgb,var(--ink) 5%,transparent));
  mix-blend-mode:screen}
.g-glass>*,.g-card>*,.workcard>*,.notecard>*,.enlace>*,.card>*{position:relative;z-index:1}

/* ---- 主题切换圆点 ---- */
.g-pill a{text-shadow:0 1px 10px rgba(0,0,0,.38)}
.themedots{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;flex:none;
  background:color-mix(in srgb,var(--ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.tdot{width:17px;height:17px;border-radius:50%;border:0;cursor:pointer;padding:0;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8),var(--dot) 60%);
  box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.5);transition:.25s}
.tdot:hover{transform:scale(1.18)}
.tdot.on{box-shadow:0 0 0 2px var(--g-bg-base),0 0 0 3.5px var(--dot),0 2px 8px rgba(0,0,0,.35)}

/* ---- 配色折叠：平时只露当前色一颗 + ▾，悬浮/聚焦展开整排（间距由 gap 改为两侧 margin 以便收拢） ---- */
.themedots{gap:0}
.themedots .tdot{margin:0 3.5px;transition:width .28s,opacity .28s,margin .28s,transform .25s}
.themedots:not(:hover):not(:focus-within):has(.tdot.on) .tdot:not(.on){width:0;opacity:0;margin:0;pointer-events:none}
.themedots:hover .tdot,.themedots:focus-within .tdot{width:17px;opacity:1;margin:0 3.5px;pointer-events:auto}
.themedots::after{content:"▾";font-size:10px;line-height:1;color:var(--g-dim);margin-left:4px;transition:transform .28s;pointer-events:none}
.themedots:hover::after,.themedots:focus-within::after{transform:rotate(180deg)}
@media (max-width:680px){ .themedots{display:none} }

/* 动效无障碍：用户系统开启「减弱动态」时，关停环境漂移/循环动画（对齐 index 范式） */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .g-blob,.card .halo{animation:none}
}

  <div class="themedots" role="group" aria-label="配色 · Tema" style="position:absolute;top:20px;right:22px;z-index:5">
    <button class="tdot" type="button" data-theme-dot="naranja" style="--dot:#ff9d2e" title="日落橙 · Naranja" aria-label="日落橙主题"></button>
    <button class="tdot" type="button" data-theme-dot="oceano" style="--dot:#4fb3ff" title="海洋蓝 · Océano" aria-label="海洋蓝主题"></button>
    <button class="tdot" type="button" data-theme-dot="bosque" style="--dot:#4ed08a" title="森林绿 · Bosque" aria-label="森林绿主题"></button>
    <button class="tdot" type="button" data-theme-dot="crepusculo" style="--dot:#b18cff" title="暮光紫 · Crepúsculo" aria-label="暮光紫主题"></button>
        <button class="tdot" type="button" data-theme-dot="bermellon" style="--dot:#c05a46" title="朱漆红 · Bermellón" aria-label="朱漆红主题"></button>
        <button class="tdot" type="button" data-theme-dot="castana" style="--dot:#c98a4b" title="栗漆棕 · Castaña" aria-label="栗漆棕主题"></button>
        <button class="tdot" type="button" data-theme-dot="jaspe" style="--dot:#b56580" title="犀皮彩 · Jaspé" aria-label="犀皮彩主题"></button>
        <button class="tdot" type="button" data-theme-dot="perla" style="--dot:#74c7b8" title="螺钿青 · Perla" aria-label="螺钿青主题"></button>
        <button class="tdot" type="button" data-theme-dot="blanco" style="--dot:#ffffff" title="纸白 · Blanco" aria-label="纸白主题"></button>
        <button class="tdot" type="button" data-theme-dot="negro" style="--dot:#181818" title="玄黑 · Negro" aria-label="玄黑主题"></button>
  </div>

  <div class="card" id="card">
    <div class="halo"></div>
    <div class="brandline">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6z"/><path d="M11 7L4 14v6h6l7-7"/></svg></div>
      <div><b>El Taller de Andres</b><small>Taller · 工坊</small></div>
    </div>

    <div class="must" id="must">首次登录，请先修改初始密码。</div>

    <!-- 登录表单 -->
    <form id="loginForm">
      <h1>回到工坊</h1>
      <p class="hint">登录后可以看到更多内容，管理员可进入管理台。</p>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="submitBtn">登录</button>
      <div class="msg err" id="msg"></div>
    </form>

    <!-- 首次登录改密表单 -->
    <form id="changeForm">
      <h1>修改密码</h1>
      <p class="hint">为了工坊安全，首次登录请换掉初始密码（至少 8 位）。</p>
      <div class="field">
        <label>当前密码</label>
        <input type="password" id="curPwd" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label>新密码</label>
        <input type="password" id="newPwd" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" id="newPwd2" autocomplete="new-password" required minlength="8">
      </div>
      <button class="btn" type="submit" id="changeBtn">保存并进入</button>
      <div class="msg err" id="msg2"></div>
    </form>

    <a class="back" href="index.html">← 返回主页</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
let pendingUser = '';   // 待改密的用户名

/* 登录后跳转目标：仅接受站内路径，如 ?next=%2Fkb.html */
const nextParam = (()=>{
  const n = new URLSearchParams(location.search).get('next');
  return (n && n.startsWith('/') && !n.startsWith('//')) ? n : null;
})();
/* kb.html 深链的 hash（如 #b=agent-handbook&c=8）会随 302 继承到本页地址栏——登录回跳时原样带回 */
function goNext(){
  const u = nextParam || 'index.html';
  location.href = u.includes('#') ? u : (u + location.hash);
}

function showErr(el, text){
  el.textContent = text; el.className = 'msg err';
  const c = $('#card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}
function showOk(el, text){ el.textContent = text; el.className = 'msg ok'; }

if (!isHttp){
  // file:// 直开：登录需要服务端
  $('#submitBtn').disabled = true;
  showErr($('#msg'), '登录需要通过服务模式访问：先运行 start-server.sh（macOS/Linux）或 start-server.bat（Windows），再用 http://localhost:8891 打开。');
}

$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = $('#submitBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: $('#username').value.trim(), password: $('#password').value })
    });
    const j = await r.json();
    if (j.ok){
      if (j.mustChangePassword){
        pendingUser = j.username;
        $('#loginForm').style.display='none';
        $('#changeForm').style.display='block';
        $('#must').style.display='block';
      } else {
        goNext();
      }
    } else {
      showErr($('#msg'), j.error || '登录失败');
    }
  } catch(err){
    showErr($('#msg'), '网络错误：请确认已通过 start-server.sh / start-server.bat 启动服务。');
  }
  btn.disabled = false;
});

$('#changeForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const n1 = $('#newPwd').value, n2 = $('#newPwd2').value;
  if (n1 !== n2) return showErr($('#msg2'), '两次输入的新密码不一致。');
  if (n1.length < 8) return showErr($('#msg2'), '新密码至少 8 位。');
  const btn = $('#changeBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: pendingUser, current: $('#curPwd').value, next: n1 })
    });
    const j = await r.json();
    if (j.ok){
      showOk($('#msg2'), '密码已更新，正在进入…');
      setTimeout(goNext, 800);
      return;
    }
    showErr($('#msg2'), j.error || '修改失败');
  } catch(err){
    showErr($('#msg2'), '网络错误，请重试。');
  }
  btn.disabled = false;
});
</script>
<script>
/* ================= 主题切换：访客可选配色，选择记忆在本机 ================= */
(function(){
  var dots = Array.prototype.slice.call(document.querySelectorAll('.tdot'));
  function apply(t){
    if (t === 'naranja') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    dots.forEach(function(d){ d.classList.toggle('on', d.dataset.themeDot === t); });
  }
  var cur = 'bermellon'; try{if(!localStorage.getItem('taller-theme')&&window.__tallerSun&&window.__tallerSun.night)cur='negro'}catch(_){}
  try { cur = localStorage.getItem('taller-theme') || (window.__tallerSun&&window.__tallerSun.night?'negro':'bermellon'); } catch(_){}
  apply(cur);
  dots.forEach(function(d){ d.addEventListener('click', function(){
    cur = d.dataset.themeDot;
    try { localStorage.setItem('taller-theme', cur); } catch(_){}
    apply(cur);
  }); });
})();
</script>

<script>/* 日落自动玄黑 · 日出回朱漆红：仅未手动选过主题的访客；每分钟复查 */
setInterval(function(){try{
if(localStorage.getItem('taller-theme'))return;
var S=window.__tallerSunFn&&window.__tallerSunFn();if(!S)return;window.__tallerSun=S;
var t=S.night?'negro':'bermellon';
if(document.documentElement.dataset.theme!==t){document.documentElement.dataset.theme=t;
document.querySelectorAll('.tdot').forEach(function(d){d.classList.toggle('on',d.dataset.themeDot===t)})}
}catch(_){}},60000);
</script></body>
